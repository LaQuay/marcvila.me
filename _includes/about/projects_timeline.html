<div class="col mt-4">
  <div class="timeline-body">
    {% for item in site.data.project-timeline %}
      <div class="timeline-item">
        <div class={% if forloop.last %} "content-last" {% else %} "content" {% endif %}>
          <h7 class="date">{{ item.from }} — {{ item.to }}</h7>
          <h4 class="head">{{ item.title }}</h4>
          <h5>{{ item.company }}</h5>
        {% if item.description %} 
          <p class="text">{{ item.description }}</p>
        {% endif %}
        </div>
      </div>
    {% endfor %}
  </div>
</div>
